apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /usr/bin/kompose --chart --provider=kubernetes --out=plantuml --namespace=plantuml --push-image --file=/src/docker-compose.yaml convert
    kompose.service.expose: plantuml.dapp.greicodex.com
    kompose.service.expose.ingress-class-name: nginx
    kompose.service.expose.ingress.annotations: '{"cert-manager.io/issuer-ref": {"name": "letsencrypt-prod", "kind": "Issuer"}}'
    kompose.service.expose.ingress.host: plantuml.dapp.greicodex.com
    kompose.service.expose.tls-secret: letsencrypt-prod
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: plantuml
  name: plantuml
  namespace: plantuml
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: plantuml
  template:
    metadata:
      annotations:
        kompose.cmd: /usr/bin/kompose --chart --provider=kubernetes --out=plantuml --namespace=plantuml --push-image --file=/src/docker-compose.yaml convert
        kompose.service.expose: plantuml.dapp.greicodex.com
        kompose.service.expose.ingress-class-name: nginx
        kompose.service.expose.ingress.annotations: '{"cert-manager.io/issuer-ref": {"name": "letsencrypt-prod", "kind": "Issuer"}}'
        kompose.service.expose.ingress.host: plantuml.dapp.greicodex.com
        kompose.service.expose.tls-secret: letsencrypt-prod
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: plantuml
    spec:
      containers:
        - env:
            - name: fprocess
              value: python /app/api.py
            # Bloquea !include de archivos locales/URLs y %getenv fuera de PLANTUML_* (exfiltracion de secretos).
            - name: PLANTUML_SECURITY_PROFILE
              value: SANDBOX
            # kompose no traduce las interpolaciones $VAR de docker-compose.yaml;
            # estas quedan fijas aqui para que un reconvert no las vuelva a perder.
            - name: PLANTUML_JAR
              value: /app/plantuml.jar
            - name: SPACE_REGION
              value: nyc3
            - name: SPACE_BUCKET
              value: greicodex-website
            - name: SPACE_FOLDER
              value: diagrams
            - name: SPACE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-credentials
                  key: SPACE_ACCESS_KEY
            - name: SPACE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-credentials
                  key: SPACE_SECRET_KEY
          image: registry.digitalocean.com/greicodex/plantuml:f426aed-py3.12.15-node22.23.4
          imagePullPolicy: IfNotPresent
          name: plantuml-api
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: "67108864"
      imagePullSecrets:
        - name: registry-greicodex
      restartPolicy: Always
